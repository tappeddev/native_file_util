name: native_file_util
description: A Flutter plugin for managing native files on iOS
version: 0.0.1
repository: https://github.com/tappeddev/native_file_util

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: NativeFileUtilPlugin
